name: Build and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.html'
      - 'assets/**'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build
        run: npm run build
      
      - name: Move dist contents to root
        run: |
          rm -rf assets
          cp -r dist/* .
          rm -rf dist
      
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Deploy: Update built files [skip ci]"
          git push
