name: Build and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build
        run: npm run build
      
      - name: Commit and push dist folder
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f dist/
          git diff --staged --quiet || git commit -m "Build: Update dist folder [skip ci]"
          git push
